name: Mercury Actions

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "develop"]
  schedule:
    - cron: "0 4 * * 1" # Mondays at 4am.

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    container: swiftlang/swift:nightly-6.4.x-noble
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Consumer Verification Tools
        run: apt-get update && apt-get install --yes --no-install-recommends python3

      - name: Test Linux
        run: swift test --jobs 2

      - name: Verify Generated Consumers
        run: |
          products="$(swift build --show-bin-path)"
          python3 Scripts/verify-generated.py --products "$products" --generator "$products/PreviewableGenerator"

      - name: Build Release
        run: swift build -c release --jobs 2

  continuous-integration:
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Verify Bundled Tools
        run: python3 Scripts/generator-artifact.py verify

      - name: Build Debug
        run: |
          swift --version
          swift build --build-tests

      - name: Verify Generated Consumers
        run: python3 Scripts/verify-generated.py --products "$(swift build --show-bin-path)"

      - name: Run Tests with Thread Sanitizer
        run: swift test --sanitize thread

      - name: Build Release
        run: swift build -c release
